{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block meta %}{% endblock meta %}
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">
                <span class="brand-full">{{ name }}</span>
                <span class="brand-short">{{ short_name }}</span>
                <div class="clover clover-brand">
                    <div class="square"></div>
                    <div class="leaf1-left"></div>
                    <div class="leaf1-right"></div>
                    <div class="leaf2-left"></div>
                    <div class="leaf2-right"></div>
                    <div class="leaf3-left"></div>
                    <div class="leaf3-right"></div>
                    <div class="leaf4-left"></div>
                    <div class="leaf4-right"></div>
                    <div class="stem"></div>
                </div>
            </a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_interest' %}">Interest</a>
            </nav>
        </div>
    </header>

    {% block content %}{% endblock content %}

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
