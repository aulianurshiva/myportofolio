{% extends 'base.html' %}
{% block meta %}
    <title>Add Interest - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="interest-section">
            <div class="container">
                <h1>Add New Interest</h1>
                <form method="post"
                      action="{% url 'main:create_interest' %}"
                      class="interest-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="button">Add Interest</button>
                    <a href="{% url 'main:show_interest' %}" class="button button-secondary">Cancel</a>
                </form>
            </div>
        </section>
    </main>
{% endblock content %}
