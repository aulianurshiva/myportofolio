<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}
                <div class="clover clover-brand">
                    <div class="square"></div>
                    <div class="leaf1-left"></div>
                    <div class="leaf1-right"></div>
                    <div class="leaf2-left"></div>
                    <div class="leaf2-right"></div>
                    <div class="leaf3-left"></div>
                    <div class="leaf3-right"></div>
                    <div class="leaf4-left"></div>
                    <div class="leaf4-right"></div>
                    <div class="stem"></div>
                </div>
            </a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_interest' %}">Interest</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Information System &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <img class="avatar" src="/static/img/FotoAulia.jpg" alt="Photo of {{ name }}">
                    <div class="clover clover-photo">
                        <div class="square"></div>
                        <div class="leaf1-left"></div>
                        <div class="leaf1-right"></div>
                        <div class="leaf2-left"></div>
                        <div class="leaf2-right"></div>
                        <div class="leaf3-left"></div>
                        <div class="leaf3-right"></div>
                        <div class="leaf4-left"></div>
                        <div class="leaf4-right"></div>
                    </div>
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/aulianurshiva" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/aulia-nur-shiva/" class="social-link">LinkedIn</a>
                        <a href="mailto:aulia.nur.shiva@gmail.com" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>
