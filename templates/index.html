{% extends 'base.html' %}
{% load static %}
{% block meta %}
    <title>{{ name }} - Portfolio</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Information System &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <img class="avatar" src="{% static 'img/FotoAulia.jpg' %}" alt="Photo of {{ name }}">
                    <div class="clover clover-photo">
                        <div class="square"></div>
                        <div class="leaf1-left"></div>
                        <div class="leaf1-right"></div>
                        <div class="leaf2-left"></div>
                        <div class="leaf2-right"></div>
                        <div class="leaf3-left"></div>
                        <div class="leaf3-right"></div>
                        <div class="leaf4-left"></div>
                        <div class="leaf4-right"></div>
                    </div>
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/aulianurshiva" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/aulia-nur-shiva/" class="social-link">LinkedIn</a>
                        <a href="mailto:aulia.nur.shiva@gmail.com" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
