<button type="button"
        class="button button-secondary button-small"
        popovertarget="delete-experience-{{ experience.id }}"
        aria-label="Delete {{ experience.title }}"
        title="Delete experience">
    Delete
</button>
<div id="delete-experience-{{ experience.id }}"
     class="interest-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-experience-title-{{ experience.id }}">
    <button type="button"
            class="interest-delete-modal__backdrop"
            popovertarget="delete-experience-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"></button>
    <div class="interest-delete-modal__content">
        <button type="button"
                class="interest-delete-modal__close"
                popovertarget="delete-experience-{{ experience.id }}"
                popovertargetaction="hide"
                aria-label="Close delete confirmation">✖</button>
        <h2 id="delete-experience-title-{{ experience.id }}">Delete Experience?</h2>
        <p>Are you sure you want to delete <strong>{{ experience.title }}</strong>?</p>
        <div class="interest-delete-modal__actions">
            <button type="button"
                    class="button button"
                    popovertarget="delete-experience-{{ experience.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-secondary">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
