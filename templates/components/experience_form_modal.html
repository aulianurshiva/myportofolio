<div id="add-experience-modal"
     class="interest-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="experience-modal-title">

    <button type="button"
            class="interest-form-modal__backdrop"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Close experience form"></button>

    <div class="interest-form-modal__content">
        <button type="button"
                class="interest-form-modal__close"
                popovertarget="add-experience-modal"
                popovertargetaction="hide"
                aria-label="Close experience form">×</button>

        <h2 id="experience-modal-title">Add New Experience</h2>

        <form id="experience-form" method="post" class="interest-form">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    <p class="form-error hide" data-error-for="{{ field.name }}"></p>
                </div>
            {% endfor %}

            <div class="interest-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-experience-modal"
                        popovertargetaction="hide">
                    Cancel
                </button>
                <button type="submit" class="button" id="experience-submit-button">
                    Add Experience
                </button>
            </div>
        </form>
    </div>
</div>
