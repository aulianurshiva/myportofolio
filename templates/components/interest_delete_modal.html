<button type="button"
        class="delete-trigger"
        popovertarget="delete-interest-{{ interest.id }}"
        aria-label="Delete {{ interest.name }}"
        title="Delete interest">
    ✖
</button>
<div id="delete-interest-{{ interest.id }}"
     class="interest-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-interest-title-{{ interest.id }}">
    <button type="button"
            class="interest-delete-modal__backdrop"
            popovertarget="delete-interest-{{ interest.id }}"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"></button>
    <div class="interest-delete-modal__content">
        <button type="button"
                class="interest-delete-modal__close"
                popovertarget="delete-interest-{{ interest.id }}"
                popovertargetaction="hide"
                aria-label="Close delete confirmation">✖</button>
        <h2 id="delete-interest-title-{{ interest.id }}">Delete Interest?</h2>
        <p>Are you sure you want to delete <strong>{{ interest.name }}</strong>?</p>
        <div class="interest-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-interest-{{ interest.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_interest' interest.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
